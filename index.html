<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7a8bd" />
    <title>For Ruksyyy ✨ - Unlock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --pink: #f58aac;
            --rose: #d96687;
            --lav: #c9b3ee;
            --cream: #fff9f5;
            --ink: #632d43;
            --glass: rgba(255, 255, 255, .56);
            --line: rgba(255, 255, 255, .74);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background: #f9c7d3;
        }

        body {
            margin: 0;
            min-height: 100dvh;
            color: var(--ink);
            font-family: Poppins, system-ui, sans-serif;
            background: radial-gradient(circle at 12% 7%, #fff6e9 0 8%, transparent 30%), radial-gradient(circle at 88% 20%, #e8d8ff 0 8%, transparent 29%), linear-gradient(145deg, #ffd9df, #f7b5c7 49%, #d7c2f2);
        }

        body:before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .42;
            background-image: radial-gradient(rgba(255, 255, 255, .8) 1px, transparent 1.5px), radial-gradient(rgba(255, 255, 255, .55) 1px, transparent 1.5px);
            background-size: 31px 31px, 57px 57px;
            background-position: 0 0, 14px 19px;
        }

        button {
            font: inherit;
            cursor: pointer;
        }

        .app {
            width: min(100%, 560px);
            min-height: 100dvh;
            margin: auto;
            position: relative;
            overflow: hidden;
            padding: calc(24px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app:before {
            content: "";
            position: absolute;
            width: 240px;
            height: 240px;
            top: -90px;
            right: -110px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, .78), rgba(255, 255, 255, 0) 68%);
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            opacity: .38;
            pointer-events: none;
        }

        .orb.one {
            width: 210px;
            height: 210px;
            background: #ffe99c;
            top: 25%;
            left: -120px;
        }

        .orb.two {
            width: 190px;
            height: 190px;
            background: #b994ea;
            right: -100px;
            bottom: 18%;
        }

        .screen {
            position: relative;
            z-index: 1;
            width: 100%;
            animation: enter .65s ease both;
        }

        .brand {
            text-align: center;
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem;
            font-weight: 700;
            color: #b84970;
            margin: 0 0 34px;
            letter-spacing: .04em;
            text-shadow: 0 2px 13px rgba(180, 58, 105, .18);
        }

        .glass {
            background: var(--glass);
            border: 1px solid var(--line);
            box-shadow: 0 20px 50px rgba(132, 57, 88, .18), inset 0 1px rgba(255, 255, 255, .75), inset 0 -1px rgba(170, 100, 140, .08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 28px;
        }

        .lock-card {
            padding: 34px 18px 26px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .lock-card:after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .35);
            filter: blur(20px);
            right: -85px;
            top: -85px;
        }

        .lock-card>* {
            position: relative;
            z-index: 1;
        }

        .lock-icon {
            width: 76px;
            height: 76px;
            margin: 0 auto 18px;
            border-radius: 25px;
            display: grid;
            place-items: center;
            font-size: 2.25rem;
            background: linear-gradient(145deg, #fff7e9, #f5b7c8);
            box-shadow: 0 12px 25px rgba(188, 77, 112, .2);
            animation: glow 2s ease-in-out infinite;
            border: 1px solid rgba(255, 255, 255, .85);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.55rem;
            line-height: 1;
            margin: 0 0 14px;
            color: #a93f66;
        }

        .sub {
            font-size: .91rem;
            line-height: 1.7;
            color: #754055;
            margin: 0 auto 23px;
            max-width: 360px;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 20px 0 23px;
        }

        .time {
            padding: 13px 3px 10px;
            background: rgba(255, 255, 255, .62);
            border-radius: 16px;
        }

        .time strong {
            display: block;
            font-size: 1.45rem;
            color: #b5456a;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
        }

        .time span {
            font-size: .61rem;
            letter-spacing: .05em;
            text-transform: uppercase;
            color: #855368;
        }

        .login-input {
            width: 100%;
            margin: 0 0 10px;
            padding: 14px 15px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, .85);
            outline: 0;
            color: #71394f;
            background: rgba(255, 255, 255, .68);
            font: inherit;
            font-size: .84rem;
        }

        .login-input:focus {
            border-color: #d57998;
            box-shadow: 0 0 0 3px rgba(213, 121, 152, .18);
        }

        .login-error {
            min-height: 19px;
            margin: 1px 2px 8px;
            color: #aa3758;
            font-size: .71rem;
            font-weight: 500;
        }

        .lock-button {
            border: 0;
            width: 100%;
            border-radius: 18px;
            padding: 15px 16px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #d77a91, #b888dc);
            box-shadow: 0 10px 20px rgba(178, 83, 117, .2);
        }

        .lock-button:active {
            transform: scale(.98);
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
        }

        @keyframes enter {
            from {
                opacity: 0;
                transform: translateY(13px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes glow {
            50% {
                box-shadow: 0 0 0 10px rgba(255, 255, 255, .2), 0 12px 25px rgba(188, 77, 112, .2);
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <div class="orb one"></div>
        <div class="orb two"></div>
        <section id="lockScreen" class="screen">
            <p class="brand">A little secret, just for you</p>
            <div class="glass lock-card">
                <div class="lock-icon" aria-hidden="true">🔐</div>
                <h1>Just for Someone Special... ❤️</h1>
                <p class="sub">There's something I made with all my heart, waiting just for you.</p>
                <div class="countdown" aria-label="Countdown to September 5th">
                    <div class="time"><strong id="days">00</strong><span>Days</span></div>
                    <div class="time"><strong id="hours">00</strong><span>Hours</span></div>
                    <div class="time"><strong id="minutes">00</strong><span>Mins</span></div>
                    <div class="time"><strong id="seconds">00</strong><span>Secs</span></div>
                </div>
                <form id="loginForm" novalidate>
                    <label class="sr-only" for="username">Your name</label>
                    <input id="username" class="login-input" type="text" autocomplete="name" placeholder="User Name" />
                    <label class="sr-only" for="birthday">Your birthday</label>
                    <input id="birthday" class="login-input" type="date" aria-label="Your birthday" />
                    <p id="loginError" class="login-error" role="alert" aria-live="polite"></p>
                    <button class="lock-button" type="submit">Unlock Secret World 🔓</button>
                </form>
            </div>
        </section>
    </main>

    <script>
        function targetDate() {
            const now = new Date();
            return new Date(now.getFullYear(), 8, 5, 0, 0, 0, 0);
        }

        function tick() {
            const now = new Date(), target = targetDate();
            const diff = target > now ? target - now : new Date(now.getFullYear() + 1, 8, 5) - now;
            const parts = [
                Math.floor(diff / 86400000),
                Math.floor(diff / 3600000) % 24,
                Math.floor(diff / 60000) % 60,
                Math.floor(diff / 1000) % 60
            ];
            ['days', 'hours', 'minutes', 'seconds'].forEach((id, i) => document.getElementById(id).textContent = String(parts[i]).padStart(2, '0'));
        }

        tick();
        setInterval(tick, 1000);

        document.getElementById('loginForm').addEventListener('submit', function (event) {
            event.preventDefault();
            const name = document.getElementById('username').value.trim().toLowerCase();
            const birthday = document.getElementById('birthday').value;
            const error = document.getElementById('loginError');

            if ((name === 'ruksana' || name === 'ruksyyy') && birthday === '2009-09-05') {
                error.textContent = '';
                // Next page par redirect karne ke liye
                window.location.href = 'index3.html';
            } else {
                error.textContent = 'Almost, sweetheart! Try your nickname (or full name) and your birthday. 💕';
            }
        });
    </script>
</body>

</html>
